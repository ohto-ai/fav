<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>收藏集</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶栏 -->
    <header class="topbar">
        <div class="topbar-inner">
            <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="打开标签目录">☰</button>
            <a class="brand" href="./">
                <span class="brand-icon">📚</span>
                <span class="brand-name">收藏集</span>
            </a>
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input type="search" id="searchInput" placeholder="搜索标题、描述、链接或标签…" autocomplete="off">
                <button class="search-clear" id="searchClear" aria-label="清空搜索" hidden>✕</button>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="themeToggle" aria-label="切换主题">🌙</button>
                <button class="btn btn-primary" id="addItemBtn">＋ 新增收藏</button>
            </div>
        </div>
    </header>

    <div class="layout">
        <!-- 侧边标签栏 -->
        <aside class="sidebar" id="sidebar" aria-label="标签目录">
            <div class="sidebar-head">
                <span class="sidebar-title">标签</span>
                <button class="text-btn" id="tagClearBtn" hidden>清除筛选</button>
            </div>
            <nav class="tag-nav" id="tagNav"></nav>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

        <!-- 主内容 -->
        <main class="main">
            <div class="toolbar">
                <div class="result-info" id="resultInfo">正在加载…</div>
                <div class="view-toggle" role="group" aria-label="视图切换">
                    <button class="icon-btn view-btn" id="viewGridBtn" data-view="grid" aria-label="卡片视图" title="卡片视图">▦</button>
                    <button class="icon-btn view-btn" id="viewListBtn" data-view="list" aria-label="列表视图" title="列表视图">☰</button>
                </div>
            </div>
            <div class="active-filters" id="activeFilters"></div>

            <section class="content">
                <div class="state-block" id="errorState" hidden>
                    <div class="state-emoji">⚠️</div>
                    <h2>收藏列表加载失败</h2>
                    <p class="state-hint" id="errorHint">请确认后端接口可用后重试</p>
                    <button class="btn btn-secondary" id="retryBtn">重试</button>
                </div>
                <div class="state-block" id="emptyState" hidden>
                    <div class="state-emoji">📭</div>
                    <h2>还没有收藏</h2>
                    <p class="state-hint">点击右上角「＋ 新增收藏」添加第一条吧</p>
                </div>
                <div class="state-block" id="noResults" hidden>
                    <div class="state-emoji">🔍</div>
                    <h2>没有匹配的收藏</h2>
                    <p class="state-hint">换个关键词，或清除筛选条件试试</p>
                </div>

                <div class="card-grid" id="cardGrid"></div>
                <div class="row-list" id="rowList" hidden></div>
            </section>
        </main>
    </div>

    <!-- 详情抽屉 -->
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true"></aside>

    <!-- 新增收藏模态框 -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <header class="modal-head">
                <h2 id="modalTitle">新增收藏</h2>
                <button class="icon-btn" id="modalCloseBtn" aria-label="关闭">✕</button>
            </header>
            <div class="modal-body">
                <form id="addItemForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemTitle">标题 <span class="req">*</span></label>
                            <input type="text" id="itemTitle" required maxlength="120" placeholder="给这个收藏起个名字">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemUrl">链接 <span class="req">*</span></label>
                            <input type="url" id="itemUrl" required maxlength="2048" placeholder="https://example.com">
                            <p class="url-hint" id="urlFetchHint"></p>
                        </div>
                    </div>
                    <div class="form-cols">
                        <div class="form-group">
                            <label for="itemIcon">图标</label>
                            <input type="text" id="itemIcon" maxlength="512" placeholder="留空用默认 🎯">
                        </div>
                        <div class="form-group">
                            <label for="itemTags">标签</label>
                            <input type="text" id="itemTags" placeholder="用逗号分隔，如：工具, 开发">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemDescription">描述</label>
                            <textarea id="itemDescription" maxlength="300" placeholder="一句话介绍，显示在卡片上" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemContent">详细内容</label>
                            <textarea id="itemContent" maxlength="20000" placeholder="Markdown 语法，支持标题、列表、代码块等" rows="6"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemPassword">管理密码 <span class="req">*</span></label>
                            <input type="password" id="itemPassword" required autocomplete="current-password" placeholder="与 Cloudflare Secret 中的 FAV_PASSWORD 相同">
                            <p class="form-hint">密码保存在你本机浏览器里（localStorage），输入一次即可；换设备需重输。</p>
                        </div>
                    </div>
                    <div class="form-status" id="formStatus"></div>
                    <footer class="modal-foot">
                        <button type="button" class="btn btn-ghost" id="previewBtn">预览</button>
                        <div class="modal-foot-right">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                            <button type="submit" class="btn btn-primary" id="submitBtn">保存收藏</button>
                        </div>
                    </footer>
                </form>
                <div class="preview-panel" id="previewPanel" hidden>
                    <div class="preview-head">
                        <h3>预览效果</h3>
                        <button class="text-btn" id="previewBackBtn">返回编辑</button>
                    </div>
                    <div id="previewBody"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="app.js"></script>
</body>
</html>
